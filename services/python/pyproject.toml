[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pajara"
version = "0.1.0"
description = "Pajara AI extraction, analysis, and reporting service"
readme = "README.md"
requires-python = ">=3.13,<3.15"
authors = [
  { name = "Pajara contributors" },
]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "openai>=2,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
pajara = "pajara.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "jsonschema[format]>=4.25,<5",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pajara"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PIE",
  "PT",
  "PTH",
  "RUF",
  "SIM",
  "UP",
  "W",
]
